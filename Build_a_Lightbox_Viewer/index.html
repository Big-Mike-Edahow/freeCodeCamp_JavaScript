<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./style.css" type="text/css" rel="stylesheet">
    <title>Lightbox Image Viewer</title>
</head>

<body>
    <main>
        <section class="center">
            <h1 class="headline-h1">JavaScript Lightbox Museum Gallery! 🖼️</h1>
            <br><br>
        </section>
        <div class="gallery">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg"
                alt="Ancient Stonehenge">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg"
                alt="High Mountain Storm">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg"
                alt="Shepherd Cottage">
        </div>
        <div class="lightbox">
            <button id="close-btn">&times;</button>
            <img id="lightbox-image" src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" alt="">
        </div>
    </main>
    <script src="./script.js" type="text/javascript"></script>
</body>

</html>
